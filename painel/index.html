<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>painel — projetos</title>
<meta name="theme-color" content="#00ade8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='220' fill='%2300ade8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bluedot:#00ade8; --dark-1:#0b1326;
  --surface:#fff; --surface-alt:#f8fafc; --text-1:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:#e2e8f0; --success:#10b981; --warning:#f59e0b; --error:#ef4444;
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s6:1.5rem; --s8:2rem; --s12:3rem;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root{
  --surface:#0b1326; --surface-alt:#162244; --text-1:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
  --border:rgba(255,255,255,.1);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-alt);color:var(--text-1);font:400 15px/1.55 Inter,system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1280px;margin:0 auto;padding-left:var(--s4);padding-right:var(--s4)}
header{background:var(--dark-1);color:#f1f5f9;padding-top:var(--s6);padding-bottom:var(--s6)}
.brand{font-family:Montserrat,sans-serif;font-weight:500;letter-spacing:-.01em;text-transform:lowercase;font-size:1.5rem;color:#fff}
.brand .dot{color:var(--bluedot)}
header p{margin:var(--s2) 0 0;color:#94a3b8;font-size:13px}
h2{font-family:Montserrat,sans-serif;font-weight:500;font-size:1.25rem;margin:var(--s12) 0 var(--s4)}
h2 .n{color:var(--text-3);font:500 12px/1 Inter;letter-spacing:.06em;text-transform:uppercase;margin-left:var(--s2)}
.grid{display:grid;gap:var(--s4);grid-template-columns:1fr;margin-top:var(--s4)}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);padding:var(--s4);
  transition:box-shadow 200ms var(--ease);box-shadow:var(--shadow-sm)}
.card:hover{box-shadow:var(--shadow-md)}
.card h3{font-family:Montserrat,sans-serif;font-weight:500;font-size:1rem;margin:0 0 var(--s2);word-break:break-word}
.meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-2);margin:0 0 var(--s2)}
.card p{margin:var(--s2) 0 0;font-size:13px;color:var(--text-2)}
.badges{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.badge{font:500 11px/1 Inter;letter-spacing:.04em;text-transform:uppercase;padding:var(--s2) var(--s3);
  border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.badge.ok{border-color:var(--success);color:var(--success)}
.badge.warn{border-color:var(--warning);color:var(--warning)}
.badge.err{border-color:var(--error);color:var(--error)}
.badge.mark{border-color:var(--bluedot);color:var(--bluedot)}
.lista{background:var(--surface);border:1px solid var(--border);padding:var(--s4)}
.lista ul{margin:0;padding-left:var(--s6)}
.lista li{font-size:14px;margin-bottom:var(--s2)}
.vazio{color:var(--text-3);font-size:14px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s6)}
button.tab{font:500 13px Inter;padding:var(--s2) var(--s4);background:transparent;color:var(--text-2);
  border:1px solid var(--border);cursor:pointer;min-height:44px;transition:all 200ms var(--ease)}
button.tab[aria-pressed=true]{border-color:var(--bluedot);color:var(--bluedot)}
button.tab:hover{color:var(--bluedot)}
:focus-visible{outline:2px solid var(--bluedot);outline-offset:2px}
footer{color:var(--text-3);font-size:12px;padding-top:var(--s12);padding-bottom:var(--s8)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <span class="brand">ness<span class="dot">.</span></span>
  <p id="cab">carregando…</p>
</div></header>

<main class="wrap">
  <section>
    <h2>Bloqueio<span class="n">espera decisão sua</span></h2>
    <div class="lista" id="bloqueio"></div>
  </section>

  <section>
    <h2>Divergência<span class="n">ativo sem commit recente</span></h2>
    <div class="lista" id="divergencia"></div>
  </section>

  <section>
    <h2>Débito<span class="n">pendências acumuladas</span></h2>
    <div class="lista" id="debito"></div>
  </section>

  <section>
    <h2>Projetos</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="projetos"></div>
  </section>
</main>

<footer class="wrap"><p id="rodape"></p></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]);
const pend = v => v && /A CONFIRMAR|A DEFINIR/i.test(v);

fetch('dashboard.json?' + Date.now())
  .then(r => r.json())
  .then(render)
  .catch(() => { $('#cab').textContent = 'nao foi possivel ler dashboard.json — a rotina semanal ja rodou?'; });

function render(d){
  const ps = d.projetos || [];
  $('#cab').textContent = ps.length + ' projetos · atualizado em ' + d.gerado_em;
  $('#rodape').textContent = 'Fonte: STATE.md de cada projeto, inventario e pareceres de revisao. Nada e digitado a mao. Gerado em ' + d.gerado_em + '.';

  // Agrupado de proposito: papel indefinido em 67 projetos e UMA decisao, nao 67 linhas de fila.
  const camp = {};
  (d.bloqueio || []).forEach(b => (b.campos || []).forEach(c => { (camp[c] = camp[c] || []).push(b.projeto); }));
  const chaves = Object.keys(camp);
  $('#bloqueio').innerHTML = chaves.length
    ? '<ul>' + chaves.map(c => {
        const v = camp[c];
        const amostra = esc(v.slice(0, 6).join(', ')) + (v.length > 6 ? ' e mais ' + (v.length - 6) : '');
        return '<li><strong>' + esc(c.replace('_', ' ')) + '</strong>: ' + v.length + ' projeto(s) — <span style="color:var(--text-3)">' + amostra + '</span></li>';
      }).join('') + '</ul>'
    : '<p class="vazio">Nada esperando voce.</p>';

  $('#divergencia').innerHTML = (d.divergencia || []).length
    ? '<ul>' + d.divergencia.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>'
    : '<p class="vazio">Nenhuma — todo projeto marcado como ativo tem commit recente.</p>';

  $('#debito').innerHTML = (d.debito || []).length
    ? '<ul>' + d.debito.map(x => '<li><strong>' + esc(x.projeto) + '</strong>: ' + esc(x.pendencias) + '</li>').join('') + '</ul>'
    : '<p class="vazio">Sem debito registrado.</p>';

  const arvores = ['todos'].concat(Array.from(new Set(ps.map(p => p.arvore).filter(Boolean))));
  $('#tabs').innerHTML = arvores.map((a, i) =>
    '<button class="tab" data-a="' + esc(a) + '" aria-pressed="' + (i === 0) + '">' + esc(a) + '</button>').join('');
  $('#tabs').onclick = e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t === b));
    cards(ps, b.dataset.a);
  };
  cards(ps, 'todos');
}

function cards(ps, arv){
  const lista = arv === 'todos' ? ps : ps.filter(p => p.arvore === arv);
  $('#projetos').innerHTML = lista.map(p => {
    if (p.lacuna) {
      return '<article class="card"><h3>' + esc(p.projeto) + '</h3>' +
             '<p class="meta">' + esc(p.arvore) + '</p>' +
             '<div class="badges"><span class="badge err">' + esc(p.lacuna) + '</span></div></article>';
    }
    const dias = p.dias_sem_commit;
    const cls = dias == null ? '' : dias <= 14 ? 'ok' : dias <= 90 ? 'warn' : 'err';
    return '<article class="card">' +
      '<h3>' + esc(p.projeto) + '</h3>' +
      '<p class="meta">' + esc(p.arvore) + ' · ' + esc(p.stack || '—') + ' · ' + esc(p.ultimo_commit || 'sem commit') + '</p>' +
      '<p>' + (pend(p.proximo_passo) ? '<span style="color:var(--text-3)">proximo passo nao declarado</span>' : esc(p.proximo_passo)) + '</p>' +
      (p.ultimo_parecer ? '<p><strong>parecer:</strong> ' + esc(p.ultimo_parecer) + '</p>' : '') +
      '<div class="badges">' +
        (p.trilha === 'bekaa' ? '<span class="badge mark">bekaa</span>' : '') +
        '<span class="badge ' + cls + '">' + (dias == null ? 'sem data' : dias + 'd sem commit') + '</span>' +
        '<span class="badge ' + (pend(p.principal) ? 'warn' : '') + '">principal: ' + esc((p.principal || '—').toLowerCase()) + '</span>' +
        '<span class="badge ' + (pend(p.revisor) ? 'warn' : '') + '">revisor: ' + esc((p.revisor || '—').toLowerCase()) + '</span>' +
      '</div></article>';
  }).join('');
}
</script>
</body>
</html>
