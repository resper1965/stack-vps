# Coder Community + Postgres. Publicado so em 127.0.0.1:7080; acesso externo pelo tunnel.
# Variaveis em /srv/coder/coder.env (600 root), geradas pelo 32-coder.sh a partir do admin.env.
# Uso: docker compose -p coder --env-file /srv/coder/coder.env -f compose/coder.yml up -d
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${PG_SENHA:?}
      POSTGRES_DB: coder
    volumes:
      - /srv/coder/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  coder:
    image: ghcr.io/coder/coder:${CODER_VERSAO:-latest}
    ports:
      - "127.0.0.1:7080:7080"
    environment:
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: https://coder.ness.com.br
      CODER_PG_CONNECTION_URL: postgresql://coder:${PG_SENHA}@database/coder?sslmode=disable
      CODER_TELEMETRY_ENABLE: "false"
      # login pelo GitHub com cadastro fechado: so entra quem o admin criar
      CODER_OAUTH2_GITHUB_CLIENT_ID: ${CODER_GITHUB_CLIENT_ID:-}
      CODER_OAUTH2_GITHUB_CLIENT_SECRET: ${CODER_GITHUB_CLIENT_SECRET:-}
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "false"
      CODER_OAUTH2_GITHUB_ALLOW_EVERYONE: "true"
    # o servidor cria os workspaces no Docker do host; os workspaces em si nunca recebem o socket
    group_add:
      - "${DOCKER_GID:?}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/coder/home:/home/coder
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
