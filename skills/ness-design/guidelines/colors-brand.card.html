<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;background:var(--surface-page)">
  <div style="display:flex;gap:24px;align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="width:120px;height:56px;background:var(--ness-bluedot)"></div>
      <div class="ness-meta">BlueDot</div>
      <div style="font:var(--type-code);color:var(--text-muted)">#00ADE8</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="width:120px;height:56px;background:var(--ness-bluedot);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-body);color:var(--accent-ink)">tinta sobre ciano</div>
      <div class="ness-meta">Accent ink</div>
      <div style="font:var(--type-code);color:var(--text-muted)">#04121C · 9.1:1</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="ness-brand" style="font-size:30px">n<span class="dot">.</span>iso</span>
      <div class="ness-meta">Marca do produto</div>

  </div>
