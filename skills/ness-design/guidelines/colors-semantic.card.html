<!-- @dsCard group="Colors" viewport="700x120" subtitle="Status sem borda: tinta sobre 16% da própria cor" name="Semânticos" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>.b{display:inline-block;font:500 10px/1.7 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:1px 8px}</style>
</head>
<body style="padding:22px;background:var(--surface-card)">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="b" style="color:var(--ness-ok);background:color-mix(in oklab,var(--ness-ok) 16%,transparent)">implementado</span>
    <span class="b" style="color:var(--ness-warn);background:color-mix(in oklab,var(--ness-warn) 16%,transparent)">parcial</span>
    <span class="b" style="color:var(--ness-bad);background:color-mix(in oklab,var(--ness-bad) 16%,transparent)">gap</span>
    <span class="b" style="color:var(--ness-info);background:color-mix(in oklab,var(--ness-info) 16%,transparent)">em análise</span>
    <span class="b" style="color:var(--text-muted);background:color-mix(in oklab,var(--text-muted) 16%,transparent)">n/a</span>
  </div>
  <div style="margin-top:14px;font:var(--type-code);color:var(--text-muted)">#10B981 · #F59E0B · #EF4444 · #00ADE8 · #94A3B8</div>
</body></html>
